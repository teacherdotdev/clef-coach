<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- French horn, side view: two round coils of tubing, a big flared bell out to the lower right, three rotary valves on the lower-left of the inner loop, leadpipe curving in from the mouthpiece at the upper left. -->
  <!-- bell flare (behind the coil so the tubing runs into it) -->
  <path d="M48 89.5 C 82 89.5, 104 74, 112 52 L 112 112 C 102 101, 82 98.5, 48 98.5 Z" fill="#f2b632" stroke="#3b2a10" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 98.5 C 84 98.5, 102 101, 112 112 L 112 92 C 100 94, 84 95, 60 95 Z" fill="#3b2a10" opacity="0.2"/>
  <path d="M80 93 C 90 91, 97 86, 101 80" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- inner loop (further back, shaded) -->
    <circle cx="48" cy="54" r="22" stroke="#3b2a10" stroke-width="12"/>
    <circle cx="48" cy="54" r="22" stroke="#f2b632" stroke-width="6"/>
    <circle cx="48" cy="54" r="22" stroke="#3b2a10" stroke-width="6" opacity="0.2"/>
    <!-- outer loop -->
    <circle cx="48" cy="54" r="39" stroke="#3b2a10" stroke-width="12"/>
    <circle cx="48" cy="54" r="39" stroke="#f2b632" stroke-width="6"/>
    <!-- leadpipe, curving in to join the top of the inner loop -->
    <path d="M13 19 C 22 28, 34 32, 48 32" stroke="#3b2a10" stroke-width="11"/>
    <path d="M13 19 C 22 28, 34 32, 48 32" stroke="#f2b632" stroke-width="5"/>
  </g>
  <!-- mouthpiece -->
  <path d="M7 13 L13 19" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M7 13 L13 19" stroke="#fbf3dc" stroke-width="5" stroke-linecap="round"/>
  <!-- bell rim and opening -->
  <ellipse cx="112" cy="82" rx="10" ry="30" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
  <ellipse cx="113" cy="82" rx="6" ry="25" fill="#3b2a10" opacity="0.25"/>
  <!-- three rotary valves -->
  <circle cx="29" cy="43" r="6.5" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
  <circle cx="27.5" cy="61.5" r="6.5" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
  <circle cx="40.5" cy="74.5" r="6.5" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
</svg>
