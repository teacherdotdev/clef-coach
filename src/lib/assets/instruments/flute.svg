    <rect x="12" y="25" width="122" height="14" rx="3" fill="#d9dee7" stroke="#3b2a10" stroke-width="3"/>
    <rect x="6" y="23.5" width="9" height="17" rx="3.5" fill="#d9dee7" stroke="#3b2a10" stroke-width="3"/>
    <ellipse cx="30" cy="30" rx="9" ry="7.5" fill="#d9dee7" stroke="#3b2a10" stroke-width="3"/>
    <ellipse cx="30" cy="29.5" rx="4.5" ry="3" fill="#2f3140"/>
    <g fill="#d9dee7" stroke="#3b2a10" stroke-width="2.5">
      <circle cx="58" cy="32" r="5.5"/>
      <circle cx="70" cy="32" r="5.5"/>
      <circle cx="82" cy="32" r="5.5"/>
      <circle cx="97" cy="32" r="5.5"/>
      <circle cx="109" cy="32" r="5.5"/>
      <circle cx="124" cy="32" r="4.5"/>
