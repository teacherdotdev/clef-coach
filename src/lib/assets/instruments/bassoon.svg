<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 128">
  <!-- Bassoon, upright front view: a tall reddish-brown wooden body of two joined tubes (short wing joint on the left, taller long joint with an ivory bell ring on the right) sitting on a rounded boot, a silver S-curved bocal off the top of the wing joint ending in a small tan double reed, three finger holes and a couple of silver keys. -->
  <!-- bocal and reed -->
  <g fill="none" stroke-linecap="round">
    <path d="M49 40 C 49 24, 40 18, 28 18 C 22 18, 18 20, 15 23" stroke="#3b2a10" stroke-width="9"/>
    <path d="M49 40 C 49 24, 40 18, 28 18 C 22 18, 18 20, 15 23" stroke="#d9dee7" stroke-width="4"/>
  </g>
  <path d="M16.5 24.5 L 13.5 21.5 L 6 27 L 11 32 Z" fill="#d9b07a" stroke="#3b2a10" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M15.5 22.5 L 13 25" stroke="#3b2a10" stroke-width="6"/>
  <!-- wood: wing joint, long joint, boot -->
  <g stroke="#3b2a10" stroke-width="3" stroke-linejoin="round" fill="#9a5a36">
    <rect x="43" y="40" width="12" height="56" rx="3"/>
    <rect x="55" y="12" width="14" height="84" rx="3"/>
    <path d="M42 92 L 70 92 L 70 112 C 70 118, 65 122, 59 122 L 53 122 C 47 122, 42 118, 42 112 Z"/>
  </g>
  <!-- shading and gloss -->
  <g fill="#3b2a10" opacity="0.22">
    <rect x="51" y="42" width="3" height="50"/>
    <rect x="64.5" y="14" width="3" height="78"/>
    <path d="M65.5 93.5 L 68.5 93.5 L 68.5 112 C 68.5 117, 64.5 120.5, 59 120.5 L 53 120.5 C 49 120.5, 45.5 118.5, 44.5 115.5 C 47 117, 50 117, 53 117 L 58 117 C 62.5 117, 65.5 114.5, 65.5 110 Z"/>
  </g>
  <path d="M59 20 L 59 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <!-- bell ring and metal ferrules -->
  <g stroke="#3b2a10" stroke-width="3" stroke-linejoin="round">
    <rect x="53" y="4" width="18" height="11" rx="3" fill="#fbf3dc"/>
    <rect x="42" y="36" width="14" height="6" rx="2" fill="#d9dee7"/>
    <rect x="54" y="57" width="16" height="5" rx="2" fill="#d9dee7"/>
    <rect x="41" y="89" width="30" height="5" rx="2" fill="#d9dee7"/>
  </g>
  <!-- finger holes and keys -->
  <g fill="#3b2a10">
    <circle cx="48.5" cy="54" r="2.5"/>
    <circle cx="48.5" cy="64" r="2.5"/>
    <circle cx="48.5" cy="74" r="2.5"/>
  </g>
  <g fill="#d9dee7" stroke="#3b2a10" stroke-width="2.5" stroke-linejoin="round">
    <rect x="58.5" y="68" width="7" height="8" rx="3"/>
    <rect x="58.5" y="78" width="7" height="8" rx="3"/>
  </g>
</svg>
