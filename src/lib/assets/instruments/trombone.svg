<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 96">
  <!-- Tenor trombone, side view tipped 10 degrees: the bell section on top with its bell flaring forward to the right, a tuning bow at the back, and a long slide of two straight parallel tubes running far past the bell to a U-crook. Hand braces between the tubes, mouthpiece pointing back. No valves. -->
  <g transform="rotate(10 72 48) translate(4 14)">
    <g fill="none" stroke-linecap="butt" stroke-linejoin="round">
      <path d="M44 22 H22 A10 10 0 0 0 22 42 H116 A9 9 0 0 1 116 60 H18" stroke="#3b2a10" stroke-width="13"/>
      <path d="M44 22 H22 A10 10 0 0 0 22 42 H116 A9 9 0 0 1 116 60 H18" stroke="#f2b632" stroke-width="7"/>
    </g>
    <!-- braces -->
    <rect x="28" y="28" width="6" height="10" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
    <rect x="98" y="46" width="6" height="10" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
    <rect x="28" y="46" width="6" height="10" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
    <!-- bell -->
    <path d="M40 18.5 L48 18.5 C59 18.5 67 11 73 0 L73 44 C67 33 59 25.5 48 25.5 L40 25.5 Z" fill="#f2b632"/>
    <path d="M40 22 L73 22 L73 44 C67 33 59 25.5 48 25.5 L40 25.5 Z" fill="#3b2a10" opacity="0.18"/>
    <path d="M50 20.5 C59 20 65 14 69 7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M40 18.5 L48 18.5 C59 18.5 67 11 73 0 M73 44 C67 33 59 25.5 48 25.5 L40 25.5" fill="none" stroke="#3b2a10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="73" cy="22" rx="6" ry="22" fill="#f2b632"/>
    <ellipse cx="73" cy="22" rx="6" ry="22" fill="#3b2a10" opacity="0.25"/>
    <ellipse cx="73" cy="22" rx="6" ry="22" fill="none" stroke="#3b2a10" stroke-width="3"/>
    <!-- mouthpiece pointing back -->
    <path d="M8 55 C11 57 14 58.5 18 58.5 L18 61.5 C14 61.5 11 63 8 65 Z" fill="#fbf3dc" stroke="#3b2a10" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="7" cy="60" rx="2.5" ry="6" fill="#fbf3dc" stroke="#3b2a10" stroke-width="3"/>
  </g>
</svg>
