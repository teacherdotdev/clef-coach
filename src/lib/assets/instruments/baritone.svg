<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <!-- Baritone / euphonium, upright side view: a slim body with one open U-bow at the bottom, a medium bell turned well forward to point up and right, three separate upright piston valves with round buttons, a short leadpipe and mouthpiece out to the upper left. -->
  <!-- body: bell cone, right branch, U-bow, left branch into the valves -->
  <path d="M60.7 10.5 C 57.5 15.5, 60 32, 60 46 L 60 96 C 60 106, 42 106, 42 96 L 42 74 L 31 74 L 31 96 C 31 121, 71 121, 71 96 L 71 50 C 71 40, 87 36.3, 91.3 29.5 Z" fill="#f2b632" stroke="#3b2a10" stroke-width="3" stroke-linejoin="round"/>
  <path d="M91.3 29.5 C 87 36.3, 71 40, 71 50 L 71 96 C 71 121, 31 121, 31 96 L 31 100 C 36 114, 66 114, 66 96 L 66 50 C 66 40, 84 35, 91.3 29.5 Z" fill="#3b2a10" opacity="0.2"/>
  <path d="M64.5 36 L 64.5 92" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <!-- bell rim, turned forward -->
  <ellipse cx="76" cy="20" rx="18" ry="6" transform="rotate(32 76 20)" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
  <ellipse cx="76.5" cy="20.5" rx="13.5" ry="3.5" transform="rotate(32 76 20)" fill="#3b2a10" opacity="0.3"/>
  <!-- leadpipe and short mouthpiece -->
  <path d="M17 60 C 12 56, 9 51, 7.5 45" fill="none" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M17 60 C 12 56, 9 51, 7.5 45" fill="none" stroke="#f2b632" stroke-width="5" stroke-linecap="round"/>
  <path d="M7.5 45 L6.8 42" fill="none" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M7.5 45 L6.8 42" fill="none" stroke="#fbf3dc" stroke-width="5" stroke-linecap="round"/>
  <!-- valve tubing tying the valves to the bell branch -->
  <path d="M21 70 L60 70" fill="none" stroke="#3b2a10" stroke-width="12"/>
  <path d="M21 70 L62.5 70" fill="none" stroke="#f2b632" stroke-width="6"/>
  <!-- three piston valves, with gaps between -->
  <g stroke="#3b2a10" stroke-width="3" stroke-linejoin="round">
    <rect x="19" y="42" width="4" height="10" fill="#fbf3dc"/>
    <rect x="34" y="42" width="4" height="10" fill="#fbf3dc"/>
    <rect x="49" y="42" width="4" height="10" fill="#fbf3dc"/>
    <ellipse cx="21" cy="41" rx="5" ry="3" fill="#fbf3dc"/>
    <ellipse cx="36" cy="41" rx="5" ry="3" fill="#fbf3dc"/>
    <ellipse cx="51" cy="41" rx="5" ry="3" fill="#fbf3dc"/>
    <rect x="17" y="51" width="8" height="24" rx="3" fill="#f2b632"/>
    <rect x="32" y="51" width="8" height="24" rx="3" fill="#f2b632"/>
    <rect x="47" y="51" width="8" height="24" rx="3" fill="#f2b632"/>
  </g>
</svg>
