<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <!-- Baritone / euphonium, upright side view: a medium bell pointing up and slightly forward, a slim conical body curling into a bottom bow, an oval coil behind, three upright piston valves with round buttons, leadpipe and mouthpiece angled out to the left. -->
  <!-- oval coil behind -->
  <ellipse cx="38" cy="86" rx="18" ry="21" fill="none" stroke="#3b2a10" stroke-width="12"/>
  <ellipse cx="38" cy="86" rx="18" ry="21" fill="none" stroke="#f2b632" stroke-width="6"/>
  <ellipse cx="38" cy="86" rx="18" ry="21" fill="none" stroke="#3b2a10" stroke-width="6" opacity="0.2"/>
  <!-- bell section and bottom bow -->
  <path d="M41 9.5 C 52 19, 57 30, 57 42 L 57 96 C 57 104, 45 104, 45 96 L 45 70 L 31 70 L 31 96 C 31 121, 71 121, 71 96 L 71 42 C 71 34, 77 27, 87 22.5 Z" fill="#f2b632" stroke="#3b2a10" stroke-width="3" stroke-linejoin="round"/>
  <path d="M87 22.5 C 77 27, 71 34, 71 42 L 71 96 C 71 121, 31 121, 31 96 L 31 100 C 36 114, 66 114, 66 96 L 66 42 C 66 34, 72 27, 87 22.5 Z" fill="#3b2a10" opacity="0.2"/>
  <path d="M57 27 C 59.5 31, 61 36, 61 44 L 61 92" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <ellipse cx="64" cy="16" rx="24" ry="7" transform="rotate(16 64 16)" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
  <ellipse cx="64" cy="16.5" rx="19" ry="4.5" transform="rotate(16 64 16)" fill="#3b2a10" opacity="0.3"/>
  <!-- leadpipe and mouthpiece -->
  <path d="M27 54 L9 36" fill="none" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M27 54 L9 36" fill="none" stroke="#f2b632" stroke-width="5" stroke-linecap="round"/>
  <path d="M9 36 L4.5 31.5" fill="none" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M9 36 L4.5 31.5" fill="none" stroke="#fbf3dc" stroke-width="5" stroke-linecap="round"/>
  <!-- piston valves -->
  <g stroke="#3b2a10" stroke-width="3" stroke-linejoin="round">
    <rect x="28" y="40" width="5" height="10" fill="#fbf3dc"/>
    <rect x="38" y="40" width="5" height="10" fill="#fbf3dc"/>
    <rect x="48" y="40" width="5" height="10" fill="#fbf3dc"/>
    <ellipse cx="30.5" cy="39" rx="5" ry="3" fill="#fbf3dc"/>
    <ellipse cx="40.5" cy="39" rx="5" ry="3" fill="#fbf3dc"/>
    <ellipse cx="50.5" cy="39" rx="5" ry="3" fill="#fbf3dc"/>
    <rect x="25" y="49" width="11" height="28" rx="3" fill="#f2b632"/>
    <rect x="35" y="49" width="11" height="28" rx="3" fill="#f2b632"/>
    <rect x="45" y="49" width="11" height="28" rx="3" fill="#f2b632"/>
  </g>
</svg>
