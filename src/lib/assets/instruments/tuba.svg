<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 128">
  <!-- Tuba, upright side view: a huge bell pointing straight up, a heavy conical body into a wide bottom bow, a wide oval coil of tubing, three piston valves on the side, leadpipe and mouthpiece out to the left. -->
  <!-- wide oval coil behind -->
  <ellipse cx="56" cy="86" rx="42" ry="22" fill="none" stroke="#3b2a10" stroke-width="14"/>
  <ellipse cx="56" cy="86" rx="42" ry="22" fill="none" stroke="#f2b632" stroke-width="8"/>
  <ellipse cx="56" cy="86" rx="42" ry="22" fill="none" stroke="#3b2a10" stroke-width="8" opacity="0.2"/>
  <!-- bell section and bottom bow -->
  <path d="M18 15 C 42 24, 54 34, 55 52 L 57 96 C 57 106, 45 106, 45 96 L 45 78 L 29 78 L 29 100 C 29 124, 84 124, 84 100 L 82 52 C 82 34, 90 24, 106 15 Z" fill="#f2b632" stroke="#3b2a10" stroke-width="3" stroke-linejoin="round"/>
  <path d="M106 15 C 90 24, 82 34, 82 52 L 84 100 C 84 124, 29 124, 29 100 L 29 104 C 35 118, 77 118, 77 100 L 76 52 C 76 34, 84 24, 106 15 Z" fill="#3b2a10" opacity="0.2"/>
  <path d="M36 22 C 50 30, 61 38, 61 54 L 62 92" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <ellipse cx="62" cy="15" rx="44" ry="9" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
  <ellipse cx="62" cy="15.5" rx="37" ry="5.5" fill="#3b2a10" opacity="0.3"/>
  <!-- leadpipe and mouthpiece -->
  <path d="M22 66 L8 48" fill="none" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M22 66 L8 48" fill="none" stroke="#f2b632" stroke-width="5" stroke-linecap="round"/>
  <path d="M8 48 L4.5 43.5" fill="none" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M8 48 L4.5 43.5" fill="none" stroke="#fbf3dc" stroke-width="5" stroke-linecap="round"/>
  <!-- piston valves -->
  <g stroke="#3b2a10" stroke-width="3" stroke-linejoin="round">
    <rect x="21" y="52" width="5" height="10" fill="#fbf3dc"/>
    <rect x="32" y="52" width="5" height="10" fill="#fbf3dc"/>
    <rect x="43" y="52" width="5" height="10" fill="#fbf3dc"/>
    <ellipse cx="23.5" cy="51" rx="5" ry="3" fill="#fbf3dc"/>
    <ellipse cx="34.5" cy="51" rx="5" ry="3" fill="#fbf3dc"/>
    <ellipse cx="45.5" cy="51" rx="5" ry="3" fill="#fbf3dc"/>
    <rect x="18" y="61" width="12" height="26" rx="3" fill="#f2b632"/>
    <rect x="29" y="61" width="12" height="26" rx="3" fill="#f2b632"/>
    <rect x="40" y="61" width="12" height="26" rx="3" fill="#f2b632"/>
  </g>
</svg>
