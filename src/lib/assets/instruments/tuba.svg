<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 128">
  <!-- Tuba, upright side view: a huge bell pointing straight up that dwarfs the body, a heavy conical body into a bottom bow, a wide darker oval coil behind sticking out both sides, three piston valves on the side, a curved leadpipe and mouthpiece out to the left. -->
  <!-- wide oval coil behind -->
  <ellipse cx="57" cy="90" rx="41" ry="19" fill="none" stroke="#3b2a10" stroke-width="14"/>
  <ellipse cx="57" cy="90" rx="41" ry="19" fill="none" stroke="#f2b632" stroke-width="8"/>
  <ellipse cx="57" cy="90" rx="41" ry="19" fill="none" stroke="#3b2a10" stroke-width="8" opacity="0.3"/>
  <!-- bell section and bottom bow -->
  <path d="M12 16 C 40 24, 56 36, 57 56 L 58 98 C 58 106, 48 106, 48 98 L 48 80 L 34 80 L 34 100 C 34 122, 80 122, 80 100 L 80 56 C 81 36, 88 24, 104 16 Z" fill="#f2b632" stroke="#3b2a10" stroke-width="3" stroke-linejoin="round"/>
  <path d="M104 16 C 88 24, 81 36, 80 56 L 80 100 C 80 122, 34 122, 34 100 L 34 104 C 40 116, 75 116, 75 100 L 75 56 C 75 36, 82 24, 104 16 Z" fill="#3b2a10" opacity="0.2"/>
  <!-- shade under the rim -->
  <path d="M12 16 C 20.4 18.4, 27.7 21.2, 33.9 24.4 Q 58 40, 92 24.4 C 95.2 21.2, 99.2 18.4, 104 16 Z" fill="#3b2a10" opacity="0.2"/>
  <path d="M58 36 C 62 42, 63 48, 63 58 L 64 94" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <ellipse cx="58" cy="16" rx="46" ry="10" fill="#f2b632" stroke="#3b2a10" stroke-width="3"/>
  <ellipse cx="58" cy="16.5" rx="39" ry="6" fill="#3b2a10" opacity="0.3"/>
  <!-- curved leadpipe and short mouthpiece -->
  <path d="M22 70 C 12 70, 7 62, 8 52" fill="none" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M22 70 C 12 70, 7 62, 8 52" fill="none" stroke="#f2b632" stroke-width="5" stroke-linecap="round"/>
  <path d="M8 52 L7.5 48" fill="none" stroke="#3b2a10" stroke-width="11" stroke-linecap="round"/>
  <path d="M8 52 L7.5 48" fill="none" stroke="#fbf3dc" stroke-width="5" stroke-linecap="round"/>
  <!-- piston valves -->
  <g stroke="#3b2a10" stroke-width="3" stroke-linejoin="round">
    <rect x="24" y="52" width="5" height="10" fill="#fbf3dc"/>
    <rect x="37" y="52" width="5" height="10" fill="#fbf3dc"/>
    <rect x="50" y="52" width="5" height="10" fill="#fbf3dc"/>
    <ellipse cx="26.5" cy="51" rx="5" ry="3" fill="#fbf3dc"/>
    <ellipse cx="39.5" cy="51" rx="5" ry="3" fill="#fbf3dc"/>
    <ellipse cx="52.5" cy="51" rx="5" ry="3" fill="#fbf3dc"/>
    <rect x="22" y="61" width="9" height="26" rx="3" fill="#f2b632"/>
    <rect x="35" y="61" width="9" height="26" rx="3" fill="#f2b632"/>
    <rect x="48" y="61" width="9" height="26" rx="3" fill="#f2b632"/>
  </g>
</svg>
